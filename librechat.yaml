# For more information, see the Configuration Guide:
# https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.2.1
cache: true

interface:
  customWelcome: "Welcome to LibreChat! Enjoy your experience."
  fileSearch: true

  privacyPolicy:
    externalUrl: "https://librechat.ai/privacy-policy"
    openNewTab: true

  termsOfService:
    externalUrl: "https://librechat.ai/tos"
    openNewTab: true
    modalAcceptance: true
    modalTitle: "Terms of Service for LibreChat"
    modalContent: "By using LibreChat, you agree to comply with our Terms of Service. Please read them carefully before proceeding."

  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

  peoplePicker:
    users: true
    groups: true
    roles: true

  marketplace:
    use: false

  fileCitations: true

registration:
  socialLogins: ["github", "google", "discord", "openid", "facebook", "apple", "saml"]

actions:
  allowedDomains:
    - "swapi.dev"
    - "librechat.ai"
    - "google.com"

endpoints:
  agents:
    disableBuilder: false
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_API_NEW_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - openrouter/auto

          - "---FREE---"
          - deepseek/deepseek-r1-0528:free
          - google/gemma-3-12b-it:free
          - google/gemma-3-27b-it:free
          - meta-llama/llama-3.3-70b-instruct:free
          - moonshotai/kimi-k2:free
          - qwen/qwen3-coder:free
          - qwen/qwen3-235b-a22b:free

          - "---EXTENDED---"
          - openai/gpt-4o:extended

          - "---ANTHROPIC---"
          - anthropic/claude-sonnet-4.5
          - anthropic/claude-opus-4.5
          - anthropic/claude-opus-4.1
          - anthropic/claude-sonnet-4

          - "---OPENAI---"
          - openai/chatgpt-4o-latest
          - openai/gpt-4o
          - openai/gpt-4.1
          - openai/gpt-4.1-mini
          - openai/gpt-5
          - openai/gpt-5-chat
          - openai/gpt-5-codex
          - openai/o3
          - openai/o3-pro
          - openai/o4-mini
          - openai/o4-mini-high

          - "---GOOGLE---"
          - google/gemini-2.5-pro
          - google/gemini-2.5-flash
          - google/gemini-2.5-flash-lite
          - google/gemini-3-pro-preview
          - google/gemini-3-flash-preview
          - google/gemini-2.5-flash-image-preview

          - "---X-AI---"
          - x-ai/grok-4
          - x-ai/grok-4-fast
          - x-ai/grok-4.1-fast
          - x-ai/grok-code-fast-1

          - "---Z-AI---"
          - z-ai/glm-4.6
          - z-ai/glm-4.6:exacto
          - z-ai/glm-4.6v

    # Direct DeepSeek (OpenAI-compatible)
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - deepseek-chat
          - deepseek-reasoner

    - name: "FluidAgent"
      apiKey: "${FLUID_AGENT_API_KEY}"
      baseURL: "${FLUID_AGENT_API_URL}"
      headers:
        X-Session-Id: "sess_{{LIBRECHAT_USER_ID}}"
      models:
        default:
          - "fluid-agent"
      fetch: false
      titleConvo: false
      titleModel: "fluid-agent"
      modelDisplayLabel: "FluidAgent"
